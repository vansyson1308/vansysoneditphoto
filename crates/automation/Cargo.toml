[package]
name = "magicpic-automation"
description = "MCP server (rmcp) over the MagicPic engine, plus a bridge to a running GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
gpu = [
    "dep:magicpic-gpu",
    "dep:wgpu",
    "dep:pollster",
    "magicpic-gpu/native",
]

[lints]
workspace = true

[dependencies]
magicpic-doc = { workspace = true }
magicpic-raster = { workspace = true }
magicpic-compose = { workspace = true }
magicpic-codecs = { workspace = true }
magicpic-io = { workspace = true }
magicpic-format = { path = "../format" }
magicpic-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.23"
schemars = "1"
getrandom = { workspace = true }
# HMAC-SHA256 for the control channel's challenge authentication: the token never crosses the wire (NV-6).
hmac = "0.12"
sha2 = "0.10"
cap-std = "4"
clap = { workspace = true }

# Optional native GPU rendering backend
magicpic-gpu = { workspace = true, optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"], optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
magicpic-color = { workspace = true }
# `gpu_lock()`: one wgpu device at a time when `cargo test` runs the GPU tests on threads.
magicpic-testkit = { workspace = true }
magicpic-geom = { workspace = true }
# Synthetic camera raws (#7789).
magicpic-raw = { workspace = true, features = ["testgen"] }
# Tiny generated PSDs and the scoped estimate charge for the high-memory approval tests
# (no multi-gigabyte fixture or global override).
magicpic-io = { workspace = true, features = ["testgen"] }
magicpic-psd = { workspace = true, features = ["testgen"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }

# Reading back an extended attribute the write path should have preserved (#7095).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
