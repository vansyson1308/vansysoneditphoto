[package]
name = "magicpic-io"
description = "Import/export between magicpic documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to magicpic-codecs; see its `heif` feature).
heif = ["magicpic-codecs/heif"]
# Test support for synthetic memory injection, estimate charges and verification across crates.
testgen = []
# Editable PDF import (experimental): painted paths and embedded-font text become editable
# layers; unsupported constructs keep the raster page.
pdf-editable = ["dep:kurbo"]

[dependencies]
magicpic-geom = { workspace = true }
magicpic-color = { workspace = true }
magicpic-cms = { workspace = true }
magicpic-raster = { workspace = true }
magicpic-doc = { workspace = true }
magicpic-compose = { workspace = true }
magicpic-algo = { workspace = true }
magicpic-psd = { workspace = true }
magicpic-codecs = { workspace = true }
magicpic-raw = { workspace = true }
magicpic-affinity = { workspace = true }
magicpic-text = { workspace = true }
magicpic-paint = { workspace = true }
magicpic-vector = { workspace = true }
magicpic-format = { path = "../format" }
craft-docpath = { workspace = true }
thiserror = { workspace = true }
ttf-parser = "0.25.1"
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# Reuse usvg's locked header reader to bound embedded SVG raster data before decoding.
imagesize = "0.13"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# The SVG fallback font search keeps each font file's character map (already in the tree through usvg).
ttf-parser = { version = "0.25", default-features = false }
# PDF import (pdf_import.rs): craft-pdf rasterizes pages in pure Rust; no shared library ships.
craft-pdf = { workspace = true }
# Editable PDF import (pdf_editable.rs): craft-pdf's Device trait uses kurbo paths and transforms.
# This is the same kurbo 0.13 that craft-pdf already links; naming it adds no crate to the graph.
kurbo = { version = "0.13", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
lopdf = { version = "0.38", default-features = false }
miniz_oxide = "0.9"
crc32fast = "1.5"
magicpic-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
magicpic-psd = { workspace = true, features = ["testgen"] }
magicpic-raw = { workspace = true, features = ["testgen"] }
magicpic-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in magicpic-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
