[package]
name = "magicpic-cli"
description = "Headless MagicPic: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["gpu"]
# Open HEIC/HEIF photos (the optional craft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["magicpic-codecs/heif"]
# Optional native GPU rendering backend, enabled by default in native CLI builds.
gpu = ["magicpic-automation/gpu"]

[lints]
workspace = true

[lib]
name = "magicpic_cli"
path = "src/lib.rs"

[[bin]]
name = "magicpic-cli"
path = "src/main.rs"

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[dependencies]
magicpic-automation = { path = "../../crates/automation" }
magicpic-doc = { workspace = true }
magicpic-engine = { workspace = true }
magicpic-io = { workspace = true, features = ["pdf-editable"] }
magicpic-raster = { workspace = true }
magicpic-format = { path = "../../crates/format" }
magicpic-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `setup`'s config.json (MIT OR Apache-2.0).
serde = { workspace = true }
# Backup and log timestamps for `mcp register` (MIT OR Apache-2.0).
chrono = { workspace = true }
# Edits Codex's config.toml keeping its comments and layout (MIT OR Apache-2.0).
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
# Reading back a saved PSD's merged-image flag (#8064).
magicpic-psd = { workspace = true }
# A real ICC profile for the --metadata test (#9466).
magicpic-cms = { workspace = true }
# Synthetic camera raws (#7789).
magicpic-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
# The PSD write recipe runner (tests/it/psd_write_oracle.rs).
xtask = { path = "../../xtask" }

[build-dependencies]
# Icon + VERSIONINFO for magicpic-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

